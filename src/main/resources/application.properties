spring.application.name=cicam-backend
server.port=8080

# --- MySQL: base creada con cicam_v2_bd.sql (ajusta usuario/clave o usa variables de entorno) ---
spring.datasource.url=jdbc:mysql://mysql-6e33f81-bryamfernandezuriarte22-d960.c.aivencloud.com:20666/cicam_v3?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo define el script SQL: Hibernate NO modifica las tablas
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Sesion persistente ---
# Secreto de los tokens JWT (minimo 32 caracteres). Cambialo en produccion.||
cicam.jwt.secret=${JWT_SECRET:cambia-este-secreto-por-uno-largo-y-aleatorio-de-32+chars}
cicam.jwt.access-minutes=60
cicam.sesion.refresh-dias=30

# --- Plan PREMIUM ---
# Soles por 30 dias. DEBE SER IGUAL al monto de tu link de Mercado Pago (19.90 es un valor de prueba).
cicam.plan.premium.precio=19.90

# --- Pago del plan Premium con Mercado Pago ---
# El usuario paga en el link; el servidor confirma el pago consultando a Mercado Pago con el access token.
# Sin access token no se activa Premium. No subas el token a GitHub.
cicam.mercadopago.link-pago=https://mpago.la/1W1M5eW
cicam.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}

# Clave API obtenida desde la variable de entorno CICAM
cicam.ia.gemini.clave=${CICAM:}

# Modelo principal: rápido y ligero
cicam.ia.gemini.modelo=gemini-3.5-flash-lite

# Modelos de respaldo
cicam.ia.gemini.modelos-respaldo=gemini-3.1-flash-lite,gemini-3.6-flash

# --- Muestra la causa de los errores 500 en la respuesta (poner false en produccion) ---
cicam.errores.detalle=true

# --- Limite de grupos que puede crear un familiar (un grupo por adulto mayor) ---
# Plan GRATUITO: 1 grupo (un adulto mayor). Plan PREMIUM: varios adultos mayores.
cicam.plan.max-grupos-gratuito=1
cicam.plan.max-grupos-premium=5

# Prueba gratuita de Premium: dias, una sola vez por familiar (0 = desactivada)
cicam.plan.premium.dias-prueba=7

# Asistente de IA: consultas por usuario y por dia
cicam.plan.ia.consultas-dia-gratuito=5
cicam.plan.ia.consultas-dia-premium=50

# Plan gratuito: dias de historial de actividades que se pueden consultar (Premium: todo)
cicam.plan.historial-dias-gratuito=30

# Chat del grupo (todos los planes): dias de mensajes visibles en el plan gratuito (Premium: todo)
cicam.plan.chat-historial-dias-gratuito=7

# --- Codigo de acceso del adulto mayor ---
# 0 = el codigo no vence (se puede usar sin limite hasta que se genere uno nuevo)
cicam.codigo.horas-expiracion=0

# --- Notificaciones push (Firebase Cloud Messaging) ---
# Ruta del JSON de la cuenta de servicio de Firebase (clave privada; NO subirla a GitHub).
# Si queda vacio, el backend funciona igual pero no envia push (los avisos se ven dentro de la app).
# Ejemplo (Windows): FCM_CREDENCIALES=C:/claves/cicam-firebase.json
cicam.fcm.credenciales=${FCM_CREDENCIALES:}

# --- HTTPS (produccion): habilita con un certificado, p. ej.
# server.ssl.key-store=classpath:cicam.p12
# server.ssl.key-store-password=...
# server.ssl.key-store-type=PKCS12

# No generar usuario/clave en memoria de Spring Security
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration